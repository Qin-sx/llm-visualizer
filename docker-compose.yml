# llm-visualizer 开发环境（容器化，不污染宿主机）
#
# 用法：
#   docker compose run --rm dev-install        # 首次：安装依赖
#   docker compose up dev                      # 启动开发服务器 → http://localhost:9000
#   docker compose run --rm check              # 类型检查
#   docker compose run --rm build              # 产出静态站点到 ./build
#
# 说明：
#   - 源码目录以 bind mount 挂进来，改代码即时生效（HMR）
#   - node_modules 放在**具名卷**里，不落宿主机磁盘：
#       ① 避免 macOS bind mount 上几万个小文件的性能问题
#       ② 避免容器内 root 在宿主机留下属主为 root 的文件
#   - 镜像与 npm 源默认走国内镜像（更快更稳）
#       直连正常的话：NODE_IMAGE=node:22-bookworm-slim NPM_REGISTRY=https://registry.npmjs.org docker compose ...
#   - 端口默认 9000，用 PORT 覆盖（映射与 --port 共用这一个值）：
#       PORT=9100 docker compose up dev

x-node: &node
  image: ${NODE_IMAGE:-docker.1panel.live/library/node:22-bookworm-slim}
  working_dir: /app
  volumes:
    - .:/app
    - node_modules:/app/node_modules
  environment:
    - npm_config_registry=${NPM_REGISTRY:-https://registry.npmmirror.com}

services:
  # 一次性：安装依赖
  dev-install:
    <<: *node
    command: npm install

  # 开发服务器
  dev:
    <<: *node
    ports:
      # 映射与容器内的 --port 用**同一个变量**，否则两边一改就错开
      - '${PORT:-9000}:${PORT:-9000}'
    environment:
      - npm_config_registry=${NPM_REGISTRY:-https://registry.npmmirror.com}
      - CI=1
    # --host 0.0.0.0 是必须的，否则容器内只监听 localhost，宿主机访问不到
    command: npm run dev -- --host 0.0.0.0 --port ${PORT:-9000}

  # 类型检查
  check:
    <<: *node
    command: npm run check

  # 端到端校验：在 Node 里直接跑参考模型与插件，检查数学正确性
  verify:
    <<: *node
    command: npm run verify

  # 构建静态站点
  build:
    <<: *node
    command: npm run build

volumes:
  node_modules:
